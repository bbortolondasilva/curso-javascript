<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>

    <section>
        <div>
            <p>
                <label for="inum">Número: </label>
                <input type="number" name="num" id="inum" required placeholder="(entre 1 e 100)" min="1" max="100" style="width: 200px;">

                <input type="button" id="btn" value="Adicionar">
            </p>

            <p>
                <select name="tab" id="itab" size="6" style="margin-bottom: 10px;">
                    <option value="">Esperando valores</option>
                </select>

                <br>

                <input type="button" value="Finalizar">
            </p>
        </div>

        <div id="res">
            
        </div>
    </section>

    <footer>&copy; Curso em Vídeo</footer>
    
    <script src="script.js"></script>
</body>
</html>
