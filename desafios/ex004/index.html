<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tabuada</h1>
    </header>

    <section>
        <div>
            <p>
                <label for="inum">Número:</label>
                <input type="number" name="num" id="inum" min="0" required>
            </p>

            <p>
                <input type="button" id="btn" value="Enviar">

        </div>

        <div id="res">
            <select name="tab" id="itab" size="10">
                <option value="">Esperando valor</option>
            </select>
        </div>
    </section>

    <footer>&copy; Curso em Vídeo</footer>
    
    <script src="script.js"></script>
</body>
</html>
